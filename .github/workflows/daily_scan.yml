name: Peregrine UK Daily Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * 1-5'   # 7:20 AM GMT (Nov-Mar)
    - cron: '20 6 * * 1-5'   # 7:20 AM BST (Mar-Oct)

concurrency:
  group: peregrine-uk-scanner
  cancel-in-progress: false

jobs:
  uk-daily-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install requests

      - name: Run UK scanner
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
        run: python uk_daily_scan.py

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uk-digest-${{ github.run_id }}
          path: uk_digest_*.html
          retention-days: 30

      - name: Alert on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
        run: |
          python - <<'PYEOF'
          import requests, os
          requests.post(
            "https://api.sendgrid.com/v3/mail/send",
            headers={"Authorization": f"Bearer {os.environ['SENDGRID_API_KEY']}",
                     "Content-Type": "application/json"},
            json={
              "personalizations": [{"to": [{"email": os.environ.get("EMAIL_TO","")}],
                                    "subject": "Peregrine UK Scanner Failed Today"}],
              "from": {"email": os.environ.get("EMAIL_FROM",""), "name": "Peregrine UK Scanner"},
              "content": [{"type": "text/plain",
                           "value": "The UK scanner failed. Check GitHub Actions."}],
            }
          )
          PYEOF
